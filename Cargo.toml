[workspace]
resolver = "3"
members = ["crates/starr-*", "crates/adapters/*"]

[workspace.package]
version = "0.4.2"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/bitoxo/starr"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# pedantic noise we accept
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# no shortcuts
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
