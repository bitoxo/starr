[package]
name = "starr-adapter-kit"
description = "HTTP plumbing for Starr adapters: per-instance client, rate limit, redaction, error mapping (ADR 0009)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Generic adapter contract test suite (wiremock-based). Enabled only from
# adapter dev-dependencies, never in the shipped binary.
contract = ["dep:wiremock", "tokio/macros"]

[dependencies]
governor = "0.10.4"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
starr-core = { path = "../starr-core" }
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
url = "2.5.8"
wiremock = { version = "0.6.5", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["fmt"] }
wiremock = "0.6.5"
