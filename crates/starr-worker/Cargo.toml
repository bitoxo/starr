[package]
name = "starr-worker"
description = "Starr background worker: job handlers, worker loop, scheduler."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls", "rustls-platform-verifier", "aws-lc-rs", "builder"] }
secrecy = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
starr-adapter-emby = { path = "../adapters/emby" }
starr-adapter-jellyfin = { path = "../adapters/jellyfin" }
starr-adapter-kit = { path = "../starr-adapter-kit" }
starr-adapter-lidarr = { path = "../adapters/lidarr" }
starr-adapter-musicbrainz = { path = "../adapters/musicbrainz" }
starr-adapter-navidrome = { path = "../adapters/navidrome" }
starr-adapter-radarr = { path = "../adapters/radarr" }
starr-adapter-sonarr = { path = "../adapters/sonarr" }
starr-adapter-stashdb = { path = "../adapters/stashdb" }
starr-adapter-tmdb = { path = "../adapters/tmdb" }
starr-adapter-whisparr = { path = "../adapters/whisparr" }
starr-core = { path = "../starr-core" }
starr-db = { path = "../starr-db" }
starr-secrets = { path = "../starr-secrets" }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
starr-adapter-kit = { path = "../starr-adapter-kit", features = ["contract"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
wiremock = "0.6.5"
