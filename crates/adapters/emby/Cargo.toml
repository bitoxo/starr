[package]
name = "starr-adapter-emby"
description = "Emby adapter for Starr (ADR 0009)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
secrecy = "0.10"
starr-adapter-kit = { path = "../../starr-adapter-kit" }
starr-core = { path = "../../starr-core" }

[dev-dependencies]
starr-adapter-kit = { path = "../../starr-adapter-kit", features = ["contract"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
url = "2.5.8"
wiremock = "0.6.5"
