[package]
name = "starr-adapter-stashdb"
description = "StashDB (stash-box GraphQL) catalog adapter and image client for Starr's private category (ADR 0014, spec 0007)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
starr-adapter-kit = { path = "../../starr-adapter-kit" }
starr-core = { path = "../../starr-core" }
url = "2.5.8"
uuid = "1.29.0"

[dev-dependencies]
secrecy = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6.5"
