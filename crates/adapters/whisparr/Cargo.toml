[package]
name = "starr-adapter-whisparr"
description = "Whisparr v3 adapter for Starr (ADR 0009, ADR 0014)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
starr-adapter-kit = { path = "../../starr-adapter-kit" }
starr-core = { path = "../../starr-core" }
uuid = "1.29.0"

[dev-dependencies]
secrecy = "0.10"
starr-adapter-kit = { path = "../../starr-adapter-kit", features = ["contract"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
url = "2.5.8"
wiremock = "0.6.5"
